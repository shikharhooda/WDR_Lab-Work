<html>

<head>

</head>
<style>
    body {
        background-color: #1a1a1a;
        color: white;
        font-family: 'Segoe UI', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    #outermost {
        background-color: #2b2b2b;
        padding: 20px;
        border-radius: 15px;
        width: 320px;
        box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.5);
    }

    #result {
        background-color: black;
        color: #00ff88;
        font-size: 2em;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 15px;
        text-align: right;
        min-height: 50px;
        box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.5);
    }

    #button_container {
        display: flex;
        gap: 10px;
    }

    #num_key {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        flex: 3;
    }

    #expressions {
        display: flex;
        flex-direction: column;
        gap: 10px;
        flex: 1;
    }

    button {
        font-size: 1.3em;
        border: none;
        border-radius: 10px;
        padding: 15px;
        cursor: pointer;
        transition: 0.2s;
    }

    .nums_buttons {
        background-color: #3a3a3a;
        color: white;
    }

    .nums_buttons:hover {
        background-color: #5a5a5a;
    }

    .opt_btns {
        background-color: #ff9500;
        color: white;
    }

    .opt_btns:hover {
        background-color: #ffb84d;
    }
</style>

<body>
    <div id="outermost">

        <!-- this div will show the result -->
        <div id="result"> </div>

        <!-- button container div starts here  -->
        <div id="button_container">
            <div id="num_key">

                <button class="nums_buttons" onclick="button_press('1')">1</button>
                <button class="nums_buttons" onclick="button_press('2')">2</button>
                <button class="nums_buttons" onclick="button_press('3')">3</button>
                <button class="nums_buttons" onclick="button_press('4')">4</button>
                <button class="nums_buttons" onclick="button_press('5')">5</button>
                <button class="nums_buttons" onclick="button_press('6')">6</button>
                <button class="nums_buttons" onclick="button_press('7')">7</button>
                <button class="nums_buttons" onclick="button_press('8')">8</button>
                <button class="nums_buttons" onclick="button_press('9')">9</button>
                <button class="nums_buttons" onclick="button_press('.')">.</button>
                <button class="nums_buttons" onclick="button_press('0')">0</button>
                <button class="nums_buttons" onclick="calculate_result()">=</button>

            </div>
            <div id="expressions">

                <button class="opt_btns" onclick="button_press('+')">+</button>
                <button class="opt_btns" onclick="button_press('-')">-</button>
                <button class="opt_btns" onclick="button_press('*')">*</button>
                <button class="opt_btns" onclick="button_press('/')">/</button>
                <button class="opt_btns" onclick="clearResult()">CLR</button>

            </div>

        </div>
    </div>
    <script>

        let result_str = ""
        let result_div = document.getElementById("result")
        result_div.innerText = result_str;

        function button_press(input) {
            result_str = result_str + input
            result_div.innerText = result_str
        }
        function calculate_result() {
            let answer = eval(result_str)
            result_div.innerText = answer
            result_str = answer
        }
        function clearResult() {

            result_div.innerText = ""
            // result_div.style.textAlign = "end"
        }
    </script>
</body>

</html>
